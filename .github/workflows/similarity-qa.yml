name: Test player similarity
on:
  workflow_dispatch:
  push:
    paths: ['similarity.js', 'scripts/test_similarity_browser.cjs', '.github/workflows/similarity-qa.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test_similarity.cjs
      - name: Test browser and image exports
        run: |
          python3 -m http.server 8765 > /tmp/magpie-http.log 2>&1 &
          node scripts/test_similarity_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-similarity-previews
          path: similarity-*.png
